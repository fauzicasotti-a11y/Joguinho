<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
:root{
  color-scheme: light; --dark:0;
  --bg:#e6edf1; --panel:#ffffff; --text:#18212b; --muted:#59687a; --border:#cbd6de;
  --accent:#0c8f72; --accent-text:#ffffff; --gold:#a8690a; --life:#c23b3b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark; --dark:1;
    --bg:#0e1420; --panel:#171f30; --text:#e9eef7; --muted:#93a0b8; --border:#2a3550;
    --accent:#3ddbb0; --accent-text:#06241c; --gold:#f2c14e; --life:#ff7070;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark; --dark:1;
  --bg:#0e1420; --panel:#171f30; --text:#e9eef7; --muted:#93a0b8; --border:#2a3550;
  --accent:#3ddbb0; --accent-text:#06241c; --gold:#f2c14e; --life:#ff7070;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  touch-action:manipulation; overflow:hidden;
}
button{ font:inherit; color:inherit; cursor:pointer; }
#app{ display:flex; flex-direction:column; height:100%; max-width:560px; margin:0 auto; }

#hud{ display:flex; align-items:center; gap:6px; padding:8px 10px; }
.stat{ background:var(--panel); border:1px solid var(--border); border-radius:999px; padding:5px 10px; font-weight:700; font-size:14px; white-space:nowrap; }
.stat.gold b{ color:var(--gold); }
.stat.hit{ border-color:var(--life); color:var(--life); }
.hud-right{ margin-left:auto; display:flex; gap:6px; }
.ibtn{ min-width:40px; height:36px; border-radius:999px; border:1px solid var(--border); background:var(--panel); font-weight:700; font-size:14px; padding:0 8px; }

#stage{ position:relative; flex:1 1 0; min-height:0; overflow:hidden; }
#cv{ position:absolute; left:0; top:0; display:block; touch-action:none; }
#toast{ position:absolute; top:6px; left:50%; transform:translateX(-50%); max-width:96%; background:var(--panel); color:var(--text); border:1px solid var(--border); padding:6px 14px; border-radius:999px; font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .2s; z-index:2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#toast.show{ opacity:1; }

#panel{ background:var(--panel); border-top:1px solid var(--border); padding:8px 10px 10px; display:flex; flex-direction:column; gap:8px; }
#ctx{ min-height:150px; }
.ptitle{ font-weight:800; font-size:14px; margin-bottom:6px; }
.hint{ color:var(--muted); font-size:13px; line-height:1.4; margin:0 0 8px; }
.chips{ display:flex; flex-wrap:wrap; gap:4px; }
.chip{ background:var(--bg); border:1px solid var(--border); border-radius:999px; padding:2px 8px; font-size:13px; }
.grid4{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.tbtn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:5px 2px; min-height:56px; border-radius:10px; border:1px solid var(--border); background:var(--bg); text-align:center; }
.tbtn .ti{ font-size:22px; }
.tbtn b{ display:block; font-size:11.5px; }
.tbtn .price{ font-weight:800; color:var(--gold); font-size:11.5px; }
.tbtn.off{ opacity:.45; }
.tbtn.lock{ opacity:.4; }
.stats{ color:var(--muted); font-size:12.5px; margin:0 0 8px; line-height:1.35; }
.bigbtn{ width:100%; min-height:44px; border:0; border-radius:12px; background:var(--accent); color:var(--accent-text); font-weight:800; font-size:15px; }
.bigbtn.ghost{ background:var(--bg); color:var(--text); border:1px solid var(--border); font-weight:700; }
.bigbtn.off{ opacity:.45; }
.bigbtn.spec{ background:var(--bg); color:var(--text); border:1px solid var(--accent); font-size:13px; text-align:left; padding:6px 8px; line-height:1.2; }
.bigbtn.spec small{ display:block; color:var(--muted); font-weight:400; font-size:11px; }
.bigbtn.spec .price{ color:var(--gold); font-size:12px; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px; }
.row2 .bigbtn{ font-size:13.5px; }
.row1{ margin-bottom:6px; }
.actrow{ display:flex; gap:6px; align-items:stretch; }
.actrow .bigbtn{ flex:1; }
.waveinfo{ flex:1; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; color:var(--muted); }
.waveinfo b{ color:var(--text); margin-left:4px; }
.abtn{ width:46px; min-height:44px; border-radius:12px; border:1px solid var(--border); background:var(--bg); font-size:19px; font-weight:800; padding:0; }
.abtn.cd{ opacity:.55; font-size:15px; }
.abtn.arm{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); }
.abtn.on{ background:var(--accent); border-color:var(--accent); }

#overlay{ position:fixed; inset:0; background:rgba(5,8,14,.68); display:flex; align-items:center; justify-content:center; padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px)); overflow-y:auto; z-index:10; }
#overlay[hidden]{ display:none; }
#overlay.solid{ background:radial-gradient(circle at 50% 28%, color-mix(in srgb, var(--accent) 18%, var(--bg)), var(--bg) 72%); }
.sheet.title{ background:transparent; border-color:transparent; }
.title .logo{ font-size:88px; line-height:1; margin:4px 0 12px; }
.title h2{ font-size:36px; margin-bottom:6px; }
.title .bigbtn{ font-size:18px; min-height:54px; margin-top:18px; }
.sheet{ width:100%; max-width:420px; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:16px; padding:18px; max-height:100%; overflow-y:auto; }
.sheet h2{ margin:0 0 4px; font-size:24px; letter-spacing:.2px; }
.sheet .sub{ margin:0 0 12px; color:var(--muted); font-size:14px; line-height:1.45; }
.steps{ margin:0 0 14px; padding-left:20px; color:var(--text); font-size:14px; line-height:1.5; }
.card{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:12px; margin-bottom:8px; border-radius:12px; border:1px solid var(--border); background:var(--bg); min-height:64px; }
.card .cicon{ font-size:30px; }
.card b{ display:block; font-size:16px; }
.card small{ display:block; color:var(--muted); font-size:13px; line-height:1.3; margin-top:2px; }
.card em{ color:var(--accent); font-style:normal; font-weight:700; font-size:13px; }
.card:active{ border-color:var(--accent); }
.card.eq{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--bg)); }
.card.lock{ opacity:.55; }
.card.done{ border-color:var(--gold); }
.card .pr{ color:var(--gold); font-weight:800; }
.xpbar{ height:8px; border-radius:99px; background:var(--bg); border:1px solid var(--border); overflow:hidden; margin:6px 0 12px; }
.xpbar i{ display:block; height:100%; background:var(--accent); }
.slots{ display:flex; gap:6px; margin:0 0 12px; }
.slot{ flex:1; height:44px; border-radius:10px; border:1px dashed var(--border); display:flex; align-items:center; justify-content:center; font-size:22px; background:var(--bg); }
.cfg{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:12px; }
.cfg .bigbtn{ font-size:12.5px; padding:4px; min-height:48px; }
.gap{ margin-top:8px; }
.big{ font-size:44px; font-weight:800; line-height:1; margin:6px 0; }
.center{ text-align:center; }
.kv{ display:grid; grid-template-columns:1fr auto; gap:4px 12px; font-size:14px; margin:0 0 14px; }
.kv span:nth-child(even){ font-weight:800; text-align:right; }
</style>
</head>
<body>

</div>

<script>
(function(){
"use strict";

const COLS = 12, ROWS = 15;
const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

/* ---------- Utilidades ---------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function shuffle(arr, rg){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rg() * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
function todayStr(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function fmt(n){ return (Math.round(n * 10) / 10).toString().replace(".", ","); }
function pct(x){ return Math.round(x * 100); }
function roll6(){ return 1 + Math.floor(Math.random() * 6); }

/* ---------- Temas e mapas ---------- */
const THEMES = [
  { name:"Campos",  decor:"🌳", bg:["#b7d8b0","#13231d"], cell:["#c6e2bf","#192d25"], hill:["#dfe9a6","#2e4a30"], path:["#e6d5a9","#3a3a52"], edge:["#b79e68","#575778"] },
  { name:"Deserto", decor:"🌵", bg:["#ecd9a3","#2a2216"], cell:["#f2e3b5","#33291b"], hill:["#f7c982","#5a4220"], path:["#c9a064","#5a4733"], edge:["#a07a42","#7a6144"] },
  { name:"Gelo",    decor:"🧊", bg:["#cfe6f2","#122030"], cell:["#dff0f8","#182b3f"], hill:["#f2fbff","#2a4663"], path:["#9fb6c8","#3b4d63"], edge:["#7b93a8","#587089"] },
  { name:"Vulcão",  decor:"🌋", bg:["#d8b9a6","#241413"], cell:["#e4c8b6","#2e1b19"], hill:["#f0b27a","#5a2f1f"], path:["#6d5a54","#4a3a38"], edge:["#4b3d39","#6b5551"] }
];
const MAPS = [
  { name:"Serpente", theme:0, castle:[11,13],
    paths:[ [[-1,1],[10,1],[10,4],[1,4],[1,7],[10,7],[10,10],[1,10],[1,13],[12,13]] ],
    rocks:[[5,2],[7,5],[4,8],[7,11],[3,2],[8,12]], hills:[[9,2],[2,5],[9,8],[2,11],[6,12]] },
  { name:"Bifurcação", theme:1, castle:[11,13],
    paths:[ [[-1,1],[10,1],[10,5],[6,5],[6,9],[1,9],[1,13],[12,13]], [[-1,1],[3,1],[3,5],[6,5],[6,9],[1,9],[1,13],[12,13]] ],
    rocks:[[7,3],[2,3],[4,7],[3,11],[9,10],[10,7]], hills:[[4,3],[9,3],[5,7],[7,7],[2,11],[7,12]] },
  { name:"Espiral", theme:2, castle:[6,9],
    paths:[ [[-1,1],[10,1],[10,13],[1,13],[1,3],[8,3],[8,11],[3,11],[3,5],[6,5],[6,9]] ],
    rocks:[[9,9],[2,5],[5,7],[7,10],[0,7],[11,7]], hills:[[9,5],[2,8],[5,8],[7,7],[5,12]] },
  { name:"Vale Cruzado", theme:3, castle:[10,14],
    paths:[ [[-1,2],[3,2],[3,6],[5,6],[5,8],[1,8],[1,11],[10,11],[10,15]], [[12,2],[8,2],[8,6],[5,6],[5,8],[1,8],[1,11],[10,11],[10,15]] ],
    rocks:[[5,3],[6,5],[0,5],[11,6],[8,9],[2,13],[7,13],[4,10]], hills:[[4,4],[7,4],[4,7],[6,7],[3,9],[6,10],[9,12]] }
];
let TH = { dark:false };
let MAP = null, PATHS = [], FLY = null;
let pathCells = new Set(), rockCells = new Set(), hillCells = new Set();
function applyTheme(){
  const T = THEMES[MAP ? MAP.theme : 0], i = TH.dark ? 1 : 0;
  TH.bg = T.bg[i]; TH.cell = T.cell[i]; TH.hill = T.hill[i]; TH.path = T.path[i]; TH.edge = T.edge[i]; TH.decor = T.decor;
  TH.speck = TH.dark ? "rgba(255,255,255,.07)" : "rgba(0,0,0,.07)";
  TH.flow = TH.dark ? "rgba(255,255,255,.12)" : "rgba(0,0,0,.09)";
}
function loadMap(i){
  MAP = MAPS[i]; PATHS = []; pathCells = new Set(); rockCells = new Set(); hillCells = new Set();
  MAP.paths.forEach((wp) => {
    for (let j = 0; j < wp.length - 1; j++) {
      const c0 = wp[j][0], r0 = wp[j][1], c1 = wp[j+1][0], r1 = wp[j+1][1];
      const dc = Math.sign(c1 - c0), dr = Math.sign(r1 - r0);
      let c = c0, r = r0;
      while (true) { pathCells.add(c + "," + r); if (c === c1 && r === r1) break; c += dc; r += dr; }
    }
    const pts = wp.map(p => [p[0] + 0.5, p[1] + 0.5]), seg = []; let len = 0;
    for (let j = 0; j < pts.length - 1; j++) {
      const dx = pts[j+1][0] - pts[j][0], dy = pts[j+1][1] - pts[j][1], l = Math.hypot(dx, dy);
      seg.push({ x:pts[j][0], y:pts[j][1], dx:dx/l, dy:dy/l, len:l, start:len }); len += l;
    }
    PATHS.push({ pts:pts, seg:seg, len:len });
  });
  MAP.rocks.forEach(p => rockCells.add(p[0] + "," + p[1]));
  MAP.hills.forEach(p => hillCells.add(p[0] + "," + p[1]));
  const a = PATHS[0].pts[0], b = PATHS[0].pts[PATHS[0].pts.length - 1];
  FLY = { sx:a[0], sy:a[1], ex:b[0], ey:b[1], len:Math.hypot(b[0] - a[0], b[1] - a[1]) };
  applyTheme();
}
function posOnPath(P, d){
  for (const s of P.seg) if (d <= s.start + s.len) { const u = d - s.start; return [s.x + s.dx*u, s.y + s.dy*u]; }
  const s = P.seg[P.seg.length - 1]; return [s.x + s.dx*s.len, s.y + s.dy*s.len];
}
function enemyPos(e){
  if (e.fly) { const u = Math.min(1, e.d / e.len); return [FLY.sx + (FLY.ex - FLY.sx)*u, FLY.sy + (FLY.ey - FLY.sy)*u]; }
  return posOnPath(PATHS[e.pi], e.d);
}

const BASE_HP = 26, LV_SOFT = 5, AUTO_DELAY = 3;

  canhao:   { name:"Canhão",   icon:"💣", cost:90,  dmg:18, range:2.2, rate:1.7, splash:1.0, color:"#c9733a", desc:"Dano em área", unlock:1, prio:"primeiro" },
  gelo:     { name:"Gelo",     icon:"❄️", cost:70,  dmg:1,  range:1.8, rate:1.2, slow:0.45, slowT:1.4, color:"#4aa8e0", desc:"Retarda todos ao redor", unlock:2 },
  tesla:    { name:"Tesla",    icon:"⚡", cost:120, dmg:9,  range:2.2, rate:1.2, chain:3, color:"#9a63d8", desc:"Raio em cadeia", unlock:3, prio:"primeiro" },
  veneno:   { name:"Veneno",   icon:"☠️", cost:100, dmg:6,  range:2.3, rate:1.0, dur:3, color:"#7fa82e", desc:"Dano contínuo em área", unlock:5, prio:"primeiro" },
  atirador: { name:"Atirador", icon:"🔭", cost:140, dmg:30, range:4.0, rate:2.4, color:"#c24b4b", desc:"Longe e forte", unlock:7, prio:"forte" },
  apoio:    { name:"Estandarte", icon:"🚩", cost:110, dmg:0, range:1.8, rate:1, support:true, color:"#d4a017", desc:"Fortalece torres vizinhas", unlock:9 }
};
const TIER_LEVELS = [5, 10, 20, 40], TIER_COST = [1.2, 3, 8, 22];
const SPEC_TIERS = {
  arqueiro: [
    [ { name:"Besteiro",  icon:"🎯", desc:"+70% dano, +15% alcance, mais lento", dm:1.7, rm:1.15, rt:0.75 },
      { name:"Metralha",  icon:"💨", desc:"Quase o dobro de disparos, menos dano", dm:0.85, rt:1.7 } ],
    [ { name:"Cordas Reforçadas", icon:"🧵", desc:"+25% de dano", dm:1.25 },
      { name:"Aljava Leve", icon:"🪶", desc:"+15% de cadência", rt:1.15 } ],
    [ { name:"Flechas Perfurantes", icon:"🔱", desc:"+90% de dano e +10% de alcance", dm:1.9, rm:1.1 },

  ],

      { name:"Morteiro",  icon:"🎇", desc:"+40% alcance e +20% dano", rm:1.4, dm:1.2, rt:0.9 } ],
    [ { name:"Pólvora Fina", icon:"⚗️", desc:"+25% de dano", dm:1.25 },

    [ { name:"Destruidor", icon:"☄️", desc:"Dano x3,5 e +50% de raio", dm:3.5, sp:1.5 },

  ],
  gelo: [
    [ { name:"Nevasca",   icon:"🌨️", desc:"+35% alcance, lentidão 20% maior", rm:1.35, sl:1.2 },
      { name:"Cristal",   icon:"💎", desc:"Pulsos causam 5x mais dano", dm:5, rt:1.1 } ],
    [ { name:"Gelo Denso", icon:"🧊", desc:"+12% de lentidão", sl:1.12 },

  tesla: [

    [ { name:"Sobrecarga", icon:"🔌", desc:"+90% de dano e +10% de cadência", dm:1.9, rt:1.1 },

/* ---------- Câmera (zoom e arrastar) ---------- */
function clampView(){
  K = BASE * VIEW.zoom;
  const W = COLS * K, H = ROWS * K;
  VIEW.ox = W <= CW ? (CW - W) / 2 : Math.min(0, Math.max(CW - W, VIEW.ox));
  VIEW.oy = H <= CH ? (CH - H) / 2 : Math.min(0, Math.max(CH - H, VIEW.oy));
}
function resize(){
  const st = $("stage"); CW = st.clientWidth; CH = st.clientHeight; DPR = window.devicePixelRatio || 1;
  BASE = Math.max(10, Math.min(CW / COLS, CH / ROWS));
  cv.style.width = CW + "px"; cv.style.height = CH + "px";
  cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
  clampView();
}
function setZoom(z){
  const cx = (CW / 2 - VIEW.ox) / K, cy = (CH / 2 - VIEW.oy) / K;
  VIEW.zoom = z; K = BASE * z; VIEW.ox = CW / 2 - cx * K; VIEW.oy = CH / 2 - cy * K; clampView();
}
new ResizeObserver(resize).observe($("stage"));

  if (n >= 6) pool.push(["blindado", 3]);
  if (n >= 7) pool.push(["enxame", 3]);
  if (n >= 9) pool.push(["voador", 3]);
  if (n >= 12) pool.push(["divisor", 2]);

    if (t === "enxame") q.push("enxame", "enxame", "enxame");

}
function pickTarget(t, cx, cy, R){

function pickTargets(t, cx, cy, R, n){

    let sc;

function useAbility(k){
  if (S.phase !== "wave") { toast("Use as habilidades durante uma onda"); return; }
  if (S.abil[k] > 0) { toast("Em recarga: " + Math.ceil(S.abil[k]) + " s"); return; }
  if (k === "raio") {
    S.targeting = S.targeting === "raio" ? null : "raio";
    toast(S.targeting ? "Toque no mapa para lançar o raio" : "Cancelado");
  } else {
    for (const e of S.enemies) if (!e.dead) applySlow(e, 0.9, 3.5);
    S.fx.push({ k:"ring", x:COLS/2, y:ROWS/2, r0:0.5, r1:10, t:0, life:0.6, col:"#9fe3ff" });

  }
}
function castRaio(x, y){
  const dm = BASE_HP * 4 * hpBase(S.wave);
  for (const e of S.enemies) if (!e.dead && Math.hypot(e.x - x, e.y - y) <= 1.6 + e.r * 0.5) dealDamage(e, dm, true);
  S.fx.push({ k:"bolt", pts:[[x, -0.5], [x, y]], t:0, life:0.3 });
  S.fx.push({ k:"ring", x:x, y:y, r0:0.2, r1:1.6, t:0, life:0.4, col:"#fff2a8" });
  S.abil.raio = AB.raio.cd * S.mods.cool; S.targeting = null;
}

  shopMsg = "";

    const i = +id.slice(3), c = MAP_PRICE[i];

  } else {

}

function doBuild(k){
  const sel = S.sel; if (!sel || sel.type !== "cell" || !towerOpen(k)) return;
  const cost = buildCost(k);
  if (S.gold < cost) { toast("Ouro insuficiente"); return; }
  const key = sel.c + "," + sel.r; if (S.grid[key]) return;
  S.gold -= cost;
  const t = { c:sel.c, r:sel.r, type:k, level:1, picks:[], mod:mergeSpec({ type:k, picks:[] }), prio:TOWERS[k].prio || "primeiro", cd:0.2, invested:cost, flash:0, off:0, hill:hillCells.has(key), aim:-Math.PI / 2 };
  S.towers.push(t); S.grid[key] = t;
  S.built[k] = (S.built[k] || 0) + 1; ACC.stats.built[k] = (ACC.stats.built[k] || 0) + 1;
  S.sel = { type:"tower", tower:t };

}
function doUpgrade(){
  const t = S.sel && S.sel.tower; if (!t) return;
  if (t.level >= gateLevel(t)) { toast("Escolha uma especialização"); return; }
  const cost = upCost(t);
  if (S.gold < cost) { toast("Ouro insuficiente"); return; }
  S.gold -= cost; t.invested += cost; t.level++;
  renderPanel(); updateHud(true);
}
function doSpec(i){
  const t = S.sel && S.sel.tower; if (!t) return;
  const tier = t.picks.length;
  if (tier >= TIER_LEVELS.length || t.level < TIER_LEVELS[tier]) return;
  const opt = SPEC_TIERS[t.type][tier][i]; if (!opt) return;
  const cost = specCost(t);
  if (S.gold < cost) { toast("Ouro insuficiente"); return; }
  S.gold -= cost; t.invested += cost; t.picks.push(i); t.mod = mergeSpec(t);

  S.fx.push({ k:"ring", x:t.c + 0.5, y:t.r + 0.5, r0:0.2, r1:1.2 + tier * 0.3, t:0, life:0.5, col:["#ffd24a", "#ffd24a", "#6fe3ff", "#ff7bf0"][tier] });
  toast("Especialização: " + opt.name); checkAch();

}
function doPrio(){

}
function doSell(){

function doTrap(k){

  if (S.gold < cost) { toast("Ouro insuficiente"); return; }

}
function startRun(){

  const rg = mulberry32(seed), own = ownedMaps();

let PD = null;
function handleTap(px, py){

  const rc = cv.getBoundingClientRect();
  const fx = (px - rc.left - VIEW.ox) / K, fy = (py - rc.top - VIEW.oy) / K;
  const c = Math.floor(fx), r = Math.floor(fy);

  if (S.grid[key]) S.sel = { type:"tower", tower:S.grid[key] };
  else if (pathCells.has(key)) S.sel = { type:"path", c:c, r:r };

  else S.sel = { type:"cell", c:c, r:r };

}
cv.addEventListener("pointerdown", (ev) => {

}

  ctx.beginPath(); ctx.arc(bx, by, 0.15*k, 0, 6.2832); ctx.fillStyle = "#1c212c"; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = tier; ctx.stroke();
  ctx.font = "bold " + Math.round(k * (t.level > 9 ? 0.15 : 0.19)) + "px sans-serif"; ctx.fillStyle = "#fff"; ctx.fillText(String(t.level), bx, by + 0.01*k);
}
function draw(){
  const k = K;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(DPR, 0, 0, DPR, VIEW.ox * DPR, VIEW.oy * DPR);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.save(); rr(0, 0, COLS*k, ROWS*k, k*0.35); ctx.clip();
  drawBoard(k);
  for (const tr of S.traps) {
    const x = (tr.c + 0.5)*k, y = (tr.r + 0.5)*k;
    if (tr.type === "mina") { ctx.font = Math.round(k*0.5) + "px " + EMOJI; ctx.fillText("💥", x, y); }
    else { ctx.beginPath(); ctx.ellipse(x, y, 0.38*k, 0.26*k, 0, 0, 6.2832); ctx.fillStyle = "rgba(40,90,160,.55)"; ctx.fill(); }
  }
  const sel = S.sel;
  if (sel && (sel.type === "cell" || sel.type === "path")) { ctx.strokeStyle = TH.accent; ctx.lineWidth = 2; rr(sel.c*k + 2, sel.r*k + 2, k - 4, k - 4, k*0.15); ctx.stroke(); }
  if (sel && sel.type === "tower") {
    const t = sel.tower, R = rangeOf(t);
    ctx.beginPath(); ctx.arc((t.c + 0.5)*k, (t.r + 0.5)*k, R*k, 0, 6.2832);
    ctx.fillStyle = t.type === "apoio" ? "rgba(255,210,74,.14)" : "rgba(255,255,255,.12)"; ctx.fill();
    ctx.strokeStyle = t.type === "apoio" ? "#ffd24a" : TH.accent; ctx.lineWidth = 2; ctx.stroke();
  }
  for (const t of S.towers) drawTower(t, k);
  for (const e of S.enemies) if (!e.fly) drawEnemy(e, k);
  for (const e of S.enemies) if (e.fly) drawEnemy(e, k);
  for (const p of S.proj) {
    ctx.beginPath(); ctx.arc(p.x*k, p.y*k, (p.type === "canhao" ? 0.1 : 0.06)*k, 0, 6.2832);
    ctx.fillStyle = p.type === "canhao" ? "#2b2b2b" : (p.type === "veneno" ? "#9be04a" : (p.type === "atirador" ? "#ff8a8a" : "#ffe27a")); ctx.fill();
  }
  for (const f of S.fx) {
    const u = f.t / f.life; ctx.globalAlpha = Math.max(0, 1 - u);
    if (f.k === "ring") {
      const r = f.r0 + (f.r1 - f.r0) * u;
      ctx.beginPath(); ctx.arc(f.x*k, f.y*k, r*k, 0, 6.2832); ctx.strokeStyle = f.col; ctx.lineWidth = 3; ctx.stroke();
      ctx.globalAlpha *= 0.25; ctx.fillStyle = f.col; ctx.fill();
    } else if (f.k === "bolt") {
      ctx.beginPath(); f.pts.forEach((p, i) => { if (i) ctx.lineTo(p[0]*k, p[1]*k); else ctx.moveTo(p[0]*k, p[1]*k); });
      ctx.strokeStyle = "#b98cf0"; ctx.lineWidth = 5; ctx.stroke(); ctx.strokeStyle = "#f3e8ff"; ctx.lineWidth = 2; ctx.stroke();
    } else if (f.k === "txt") {
      ctx.font = "bold " + Math.round(k * f.size) + "px sans-serif"; ctx.fillStyle = f.col; ctx.fillText(f.text, f.x*k, (f.y - u*0.4)*k);
    } else if (f.k === "p") {
      ctx.beginPath(); ctx.arc(f.x*k, f.y*k, 0.05*k, 0, 6.2832); ctx.fillStyle = f.col; ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  if (S.targeting === "raio") {
    ctx.fillStyle = "rgba(255,240,150,.12)"; ctx.fillRect(0, 0, COLS*k, ROWS*k);
    ctx.fillStyle = "#fff"; ctx.font = "bold " + Math.round(k*0.45) + "px sans-serif"; ctx.fillText("Toque para lançar o raio", COLS*k/2, 0.5*k);
  }
  if (S.paused) {
    ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(0, 0, COLS*k, ROWS*k);
    ctx.fillStyle = "#fff"; ctx.font = "bold " + Math.round(k*0.9) + "px sans-serif"; ctx.fillText("Pausado", COLS*k/2, ROWS*k/2);
  }
  ctx.restore();
  rr(0, 0, COLS*k, ROWS*k, k*0.35); ctx.strokeStyle = TH.edge; ctx.lineWidth = 2; ctx.stroke();
}

/* ---------- Loop ---------- */
let last = 0;
function loop(ts){
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts; animT += dt;
  if (!S.paused) {
    if (S.phase === "wave") { for (let i = 0; i < S.speed; i++) { step(dt); if (S.phase !== "wave") break; } }
    else {
      updateFx(dt);
      if (S.phase === "build" && autoStart) { autoT += dt; if (autoT >= AUTO_DELAY) startWave(); }
    }
  }
  draw(); updateHud(false);
  requestAnimationFrame(loop);
}

resize(); renderPanel(); showTitle(); updateHud(true);
requestAnimationFrame(loop);
})();
</script>
